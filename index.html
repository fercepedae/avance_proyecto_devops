
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy Test - DevOps Proyecto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .info-box p {
            margin: 10px 0;
            color: #555;
            font-size: 0.95em;
        }
        
        .footer {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deploy Test</h1>
        <div class="status">✓ EXITOSO</div>
        
        <p>¡El despliegue de prueba se ha completado correctamente!</p>
        
        <div class="info-box">
            <p><strong>Proyecto:</strong> DevOps</p>
            <p><strong>Versión:</strong> 1.0.0</p>
            <p><strong>Estado:</strong> Producción</p>
            <p><strong>Fecha:</strong> 10 de Abril, 2026</p>
        </div>
        
        <p>El sistema está funcionando correctamente y listo para ser utilizado.</p>
        
        <div class="footer">
            <p>© 2026 DevOps Proyecto. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
